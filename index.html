<!-- FILE: teacher-app/index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#E8600A" />
    <title>School Office - Developer Console</title>
    <script>
      // Startup safety net: agar app load / start na ho to blank white page ki jagah wajah dikhao.
      // (App start ho jaye to #root me content aa jata hai aur ye kuch nahi karta.)
      (function () {
        function show(msg) {
          var r = document.getElementById("root");
          if (!r || r.children.length) return;
          r.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:420px;margin:12vh auto;padding:20px;color:#e5e7eb;background:#111827;border-radius:14px;border:1px solid #374151">' +
            '<div style="font-size:18px;font-weight:700;margin-bottom:8px">App could not start</div>' +
            '<div style="font-size:13px;opacity:.8;margin-bottom:12px">Please reload. If it keeps happening, clear this site\'s cache / data and try again.</div>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;font-size:11.5px;opacity:.7;margin:0 0 14px">' +
            String(msg).replace(/</g, "&lt;").slice(0, 400) + "</pre>" +
            '<button onclick="location.reload()" style="padding:10px 16px;border:0;border-radius:10px;background:#E8600A;color:#fff;font-weight:700">Reload</button></div>';
        }
        window.addEventListener("error", function (e) {
          var t = e.target;
          show(t && (t.src || t.href) ? "Could not load: " + (t.src || t.href) : e.message || "Unknown error");
        }, true);
        window.addEventListener("unhandledrejection", function (e) { show((e.reason && (e.reason.message || e.reason)) || "Unknown error"); });
        setTimeout(function () { show("The app did not start (no response after 12 seconds)."); }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
